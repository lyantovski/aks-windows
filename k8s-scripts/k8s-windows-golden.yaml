---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: windows-pvc
  namespace: windows
  labels:
    app: windows
    role: golden-storage
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: default
  resources:
    requests:
      storage: 64Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: windows-golden-builder
  namespace: windows
  labels:
    app: windows-golden-builder
spec:
  restartPolicy: Never
  containers:
  - name: windows
    image: dockurr/windows
    env:
    - name: VERSION
      value: "11"
    - name: DISK_SIZE
      value: "64G"
    - name: USERNAME
      valueFrom:
        secretKeyRef:
          name: windows-credentials
          key: username
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: windows-credentials
          key: password
    ports:
    - containerPort: 8006
      name: http
      protocol: TCP
    - containerPort: 3389
      name: rdp
      protocol: TCP
    - containerPort: 3389
      name: udp
      protocol: UDP
    - containerPort: 5900
      name: vnc
      protocol: TCP
    securityContext:
      capabilities:
        add:
        - NET_ADMIN
      privileged: true
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
    readinessProbe:
      tcpSocket:
        port: rdp
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 240
    volumeMounts:
    - mountPath: /storage
      name: storage
    - mountPath: /dev/kvm
      name: dev-kvm
    - mountPath: /dev/net/tun
      name: dev-tun
  terminationGracePeriodSeconds: 120
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: windows-pvc
  - name: dev-kvm
    hostPath:
      path: /dev/kvm
      type: CharDevice
  - name: dev-tun
    hostPath:
      path: /dev/net/tun
      type: CharDevice
