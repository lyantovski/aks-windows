---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: windows-pvc
  namespace: windows
  labels:
    app: windows
    role: golden-storage
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: default
  resources:
    requests:
      storage: 64Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: windows
  namespace: windows
  labels:
    name: windows
spec:
  serviceName: windows-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: windows
  template:
    metadata:
      labels:
        app: windows
    spec:
      containers:
      - name: windows
        image: dockurr/windows
        env:
        - name: VERSION
          value: "11"
        - name: DISK_SIZE
          value: "64G"
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: windows-credentials
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: windows-credentials
              key: password
        ports:
          - containerPort: 8006
            name: http
            protocol: TCP
          - containerPort: 3389
            name: rdp
            protocol: TCP
          - containerPort: 3389
            name: udp
            protocol: UDP
          - containerPort: 5900
            name: vnc
            protocol: TCP
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
          privileged: true
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 8Gi
        readinessProbe:
          tcpSocket:
            port: rdp
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 120
        volumeMounts:
        - mountPath: /storage
          name: storage
        - mountPath: /dev/kvm
          name: dev-kvm
        - mountPath: /dev/net/tun
          name: dev-tun
      terminationGracePeriodSeconds: 120
      volumes:
      - hostPath:
          path: /dev/kvm
          type: CharDevice
        name: dev-kvm
      - hostPath:
          path: /dev/net/tun
          type: CharDevice
        name: dev-tun
  volumeClaimTemplates:
  - metadata:
      name: storage
      labels:
        app: windows
        role: replica-storage
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: default
      resources:
        requests:
          storage: 64Gi
      dataSource:
        kind: PersistentVolumeClaim
        name: windows-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: windows-headless
  namespace: windows
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8006
      protocol: TCP
      targetPort: 8006
  selector:
    app: windows
---
apiVersion: v1
kind: Service
metadata:
  name: windows
  namespace: windows
spec:
  internalTrafficPolicy: Cluster
  ports:
    - name: http
      port: 8006
      protocol: TCP
      targetPort: 8006
    - name: rdp
      port: 3389
      protocol: TCP
      targetPort: 3389
    - name: udp
      port: 3389
      protocol: UDP
      targetPort: 3389
    - name: vnc
      port: 5900
      protocol: TCP
      targetPort: 5900
  selector:
    app: windows
  type: ClusterIP
