apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: __TARGET_PVC__
  namespace: __NAMESPACE__
  labels:
    app: windows
    role: golden-storage
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: __STORAGE_CLASS__
  resources:
    requests:
      storage: __STORAGE_SIZE__
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portable-windows-import-staging
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: portable-windows-import
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: __STORAGE_CLASS__
  resources:
    requests:
      storage: __STAGING_SIZE__
---
apiVersion: batch/v1
kind: Job
metadata:
  name: portable-windows-import
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: portable-windows-import
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portable-windows-import
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: importer
        image: __TRANSFER_IMAGE__
        imagePullPolicy: Always
        args:
        - /usr/local/bin/import.sh
        env:
        - name: ACR_REGISTRY
          value: __ACR_REGISTRY__
        - name: ACR_USERNAME
          valueFrom:
            secretKeyRef:
              name: portable-windows-oras
              key: username
        - name: ACR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portable-windows-oras
              key: password
        - name: ARTIFACT_REPOSITORY
          value: __ARTIFACT_REPOSITORY__
        - name: ARTIFACT_TAG
          value: __ARTIFACT_TAG__
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        volumeMounts:
        - name: target
          mountPath: /target
        - name: staging
          mountPath: /staging
      volumes:
      - name: target
        persistentVolumeClaim:
          claimName: __TARGET_PVC__
      - name: staging
        persistentVolumeClaim:
          claimName: portable-windows-import-staging
